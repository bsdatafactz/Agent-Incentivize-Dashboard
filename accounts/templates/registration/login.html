{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectrum Field — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
<script>
  try {
    var t = localStorage.getItem('sf-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
  <section class="login-screen" id="loginScreen">
    <div class="signal-rings"><span></span><span></span><span></span></div>
    <div class="login-card">
      <img class="login-logo logo-navy" src="{% static 'dashboard/img/spectrum-logo-navy.png' %}" alt="Spectrum">
      <img class="login-logo logo-white" src="{% static 'dashboard/img/spectrum-logo-white.png' %}" alt="Spectrum">
      <h1>Field Console</h1>
      <p class="login-sub">Sign in to see today's rank, points, and route insights.</p>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="field">
          <label for="id_username">Agent ID</label>
          <input id="id_username" name="username" type="text" placeholder="SP-40217" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="id_password">Password</label>
          <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn-primary" type="submit">Sign in</button>
      </form>
      <p class="login-foot">FIELD SALES &middot; SPECTRUM</p>
    </div>
  </section>
</body>
</html>
